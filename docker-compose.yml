name: twinvet-care

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: twinvet
      POSTGRES_USER: twinvet
      POSTGRES_PASSWORD: ${TWINVET_DB_PASSWORD:-twinvet_local}
    ports:
      # 5432 is already used on this host; keep a dedicated port.
      - "127.0.0.1:${TWINVET_DB_PORT:-55433}:5432"
    volumes:
      - twinvet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twinvet -d twinvet"]
      interval: 5s
      timeout: 3s
      retries: 20

  # API + SPA image. Not started by default: `docker compose --profile app up -d --build`.
  # Put HTTPS (reverse proxy / platform TLS) in front of it; the session cookie is Secure.
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://twinvet:${TWINVET_DB_PASSWORD:-twinvet_local}@db:5432/twinvet
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the environment}
      ENV_FILE: ""
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000}
      WORKER_THREADS: ${WORKER_THREADS:-2}
    ports:
      - "127.0.0.1:${TWINVET_APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  twinvet_pgdata:
