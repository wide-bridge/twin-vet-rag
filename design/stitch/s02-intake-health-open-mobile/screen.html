<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwinVet Care - 우리 아이 정보 입력 검증 및 상세 상태 (Mobile 390px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#402878',
              blue: '#0060C0',
              blueHover: '#004E9E',
            },
            textMain: '#102858',
            textMuted: '#526078',
            borderOutline: '#7A879A',
            borderDivider: '#DCE3EE',
            bgPage: '#F7F9FC',
            errorRed: '#B42318',
            errorBg: '#FFF0EE',
          },
          fontFamily: {
            sans: ['"Noto Sans KR"', 'sans-serif'],
          },
          borderRadius: {
            'card': '12px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #F7F9FC;
      color: #102858;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-outlined.fill-1 {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<!-- TwinVet Care brand lockup (scripts/apply_brand_lockup.py) -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="../../../brand/brand-tokens.css" rel="stylesheet"/>
<link href="../../../brand/brand-lockup.css" rel="stylesheet"/>
<style>
  header .brand-lockup { --logo-w: 108px; text-decoration: none; }
  header:has(.brand-lockup) { background-color: #FFFFFF; } /* logo is made for a white background */
  /* the logo's speech bubbles reach the image top: give the header breathing room above the lockup */
  header:has(.brand-lockup) { height: auto; min-height: 64px; padding-top: 14px; padding-bottom: 8px; }
</style>
</head>
<body class="bg-[#F7F9FC] text-[#102858] min-h-screen flex flex-col justify-between items-center selection:bg-blue-100">

  <!-- Mobile Container 390px -->
  <div class="w-full max-w-[390px] min-h-screen bg-[#F7F9FC] flex flex-col relative pb-[168px] shadow-lg border-x border-[#DCE3EE]">
    
    <!-- Header -->
    <header class="h-14 px-4 bg-white border-b border-[#DCE3EE] flex items-center justify-between sticky top-0 z-40">
      <a class="brand-lockup" href="#" aria-label="TwinVet Care"><img src="../../../brand/twinvet-logo-original.png" alt="" width="683" height="283"/><span class="care" aria-hidden="true">Care</span></a>
      <button type="button" aria-label="메뉴 더보기" class="w-10 h-10 flex items-center justify-center text-[#526078] hover:bg-[#F2F3FC] rounded-full transition-colors">
        <span class="material-symbols-outlined text-[22px]">more_vert</span>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 space-y-4">
      
      <!-- Card: 우리 아이 정보 (상태 1: 유효성 검사 에러 표시 및 건강상태(선택) 확장 상태) -->
      <section class="bg-white rounded-[12px] border border-[#DCE3EE] p-4 shadow-sm">
        
        <!-- Card Header -->
        <div class="flex items-center justify-between pb-3.5 border-b border-[#DCE3EE]/80">
          <div class="flex items-center gap-2">
            <span class="material-symbols-outlined fill-1 text-[#0060C0] text-[20px]">pets</span>
            <h2 class="text-[17px] font-bold text-[#102858]">우리 아이 정보</h2>
          </div>
          <span class="text-[12px] text-[#526078] font-normal">* 필수 항목</span>
        </div>

        <form class="pt-4 space-y-4" onsubmit="return false;">
          
          <!-- 품종 입력 필드 (에러 상태) -->
          <div>
            <label for="breed-input" class="block text-[14px] font-semibold text-[#102858] mb-1.5">
              품종 <span class="text-[#B42318]">*</span>
            </label>
            <div class="relative">
              <input 
                id="breed-input" 
                type="text" 
                placeholder="예: 말티즈, 믹스견, 모름" 
                class="w-full h-11 pl-3.5 pr-10 text-[15px] rounded-[10px] border border-[#B42318] bg-[#FFF0EE]/30 text-[#102858] placeholder-[#7A879A] focus:outline-none focus:ring-2 focus:ring-[#B42318] focus:border-[#B42318] transition-all"
                aria-invalid="true"
                aria-describedby="breed-error"
              />
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-[#7A879A]">
                <span class="material-symbols-outlined text-[20px]">search</span>
              </div>
            </div>
            <!-- 품종 에러 메시지 -->
            <p id="breed-error" class="mt-1.5 flex items-center gap-1 text-[13px] font-medium text-[#B42318]">
              <span class="material-symbols-outlined text-[16px] fill-1 text-[#B42318]">error</span>
              <span>품종을 입력해 주세요</span>
            </p>
          </div>

          <!-- 나이 입력 필드 (에러 상태) -->
          <div>
            <label class="block text-[14px] font-semibold text-[#102858] mb-1.5">
              나이 <span class="text-[#B42318]">*</span>
            </label>
            <div class="grid grid-cols-2 gap-2.5">
              <!-- 년 입력 -->
              <div class="relative">
                <input 
                  type="number" 
                  min="0" 
                  max="30" 
                  placeholder="0" 
                  class="w-full h-11 pl-3.5 pr-8 text-[15px] rounded-[10px] border border-[#B42318] bg-[#FFF0EE]/30 text-[#102858] placeholder-[#7A879A] focus:outline-none focus:ring-2 focus:ring-[#B42318] focus:border-[#B42318] transition-all"
                  aria-invalid="true"
                  aria-describedby="age-error"
                />
                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-[14px] text-[#526078]">년</span>
              </div>
              <!-- 개월 입력 -->
              <div class="relative">
                <input 
                  type="number" 
                  min="0" 
                  max="11" 
                  placeholder="0" 
                  class="w-full h-11 pl-3.5 pr-11 text-[15px] rounded-[10px] border border-[#B42318] bg-[#FFF0EE]/30 text-[#102858] placeholder-[#7A879A] focus:outline-none focus:ring-2 focus:ring-[#B42318] focus:border-[#B42318] transition-all"
                  aria-invalid="true"
                  aria-describedby="age-error"
                />
                <span class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-[14px] text-[#526078]">개월</span>
              </div>
            </div>
            <!-- 나이 에러 메시지 -->
            <p id="age-error" class="mt-1.5 flex items-center gap-1 text-[13px] font-medium text-[#B42318]">
              <span class="material-symbols-outlined text-[16px] fill-1 text-[#B42318]">error</span>
              <span>나이를 입력해 주세요</span>
            </p>
            <p class="mt-1 flex items-center gap-1 text-[12px] text-[#526078]">
              <span class="material-symbols-outlined text-[14px]">info</span>
              <span>정확하지 않아도 괜찮아요</span>
            </p>
          </div>

          <!-- 건강상태 (선택) - 확장된 섹션 -->
          <div class="pt-2 border-t border-[#DCE3EE]">
            <div class="flex items-center justify-between py-2 text-[14px] font-semibold text-[#102858]">
              <div class="flex items-center gap-1.5">
                <span>건강상태</span>
                <span class="text-[12px] font-normal text-[#526078]">(선택)</span>
              </div>
              <span class="material-symbols-outlined text-[20px] text-[#526078] rotate-180 transition-transform">keyboard_arrow_down</span>
            </div>

            <!-- 건강상태 상세 입력 폼 (확장 상태) -->
            <div class="mt-2.5 space-y-3.5 bg-[#F7F9FC] p-3 rounded-[10px] border border-[#DCE3EE]">
              
              <!-- 체중 입력 -->
              <div>
                <label for="weight-input" class="block text-[13px] font-medium text-[#102858] mb-1">
                  체중 <span class="text-[12px] font-normal text-[#526078]">(선택)</span>
                </label>
                <div class="relative w-full">
                  <input 
                    id="weight-input"
                    type="number" 
                    step="0.1" 
                    min="0"
                    placeholder="예: 4.5"
                    class="w-full h-10 pl-3 pr-9 text-[14px] rounded-[8px] border border-[#7A879A]/60 bg-white text-[#102858] placeholder-[#7A879A] focus:outline-none focus:ring-1 focus:ring-[#0060C0] focus:border-[#0060C0]"
                  />
                  <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-[13px] font-medium text-[#526078]">kg</span>
                </div>
              </div>

              <!-- 중성화 세그먼트 컨트롤 -->
              <div>
                <span class="block text-[13px] font-medium text-[#102858] mb-1.5">
                  중성화 <span class="text-[12px] font-normal text-[#526078]">(선택)</span>
                </span>
                <div class="grid grid-cols-3 gap-1 bg-[#DCE3EE]/60 p-1 rounded-[8px]" role="group" aria-label="중성화 여부 선택">
                  <button type="button" class="py-1.5 text-[13px] font-medium text-[#526078] rounded-[6px] hover:text-[#102858] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0060C0] bg-transparent">
                    예
                  </button>
                  <button type="button" class="py-1.5 text-[13px] font-medium text-[#526078] rounded-[6px] hover:text-[#102858] transition-colors focus:outline-none focus:ring-1 focus:ring-[#0060C0] bg-transparent">
                    아니오
                  </button>
                  <button type="button" class="py-1.5 text-[13px] font-semibold text-[#0060C0] bg-white rounded-[6px] shadow-sm transition-all focus:outline-none focus:ring-1 focus:ring-[#0060C0]">
                    모름
                  </button>
                </div>
              </div>

              <!-- 기존 질환·복용 약 -->
              <div>
                <div class="flex items-center justify-between mb-1">
                  <label for="condition-input" class="block text-[13px] font-medium text-[#102858]">
                    기존 질환·복용 약 <span class="text-[12px] font-normal text-[#526078]">(선택)</span>
                  </label>
                  <span class="text-[11px] text-[#526078]">0/300</span>
                </div>
                <textarea 
                  id="condition-input"
                  rows="2"
                  maxlength="300"
                  placeholder="예: 슬개골 탈구 2기 진단받음, 심장약 복용 중"
                  class="w-full p-2.5 text-[13px] rounded-[8px] border border-[#7A879A]/60 bg-white text-[#102858] placeholder-[#7A879A] focus:outline-none focus:ring-1 focus:ring-[#0060C0] focus:border-[#0060C0] resize-none"
                ></textarea>
              </div>

            </div>
          </div>

        </form>
      </section>

      <!-- 이런 질문을 할 수 있어요 예시 섹션 (컨텍스트 유지) -->
      <section class="space-y-2 opacity-75">
        <div class="flex items-center gap-1.5 px-1">
          <span class="material-symbols-outlined text-[#0060C0] text-[18px]">lightbulb</span>
          <h3 class="text-[13px] font-semibold text-[#102858]">이런 질문을 할 수 있어요</h3>
        </div>
        <div class="space-y-1.5">
          <button type="button" class="w-full text-left p-3 rounded-[10px] bg-white border border-[#DCE3EE] text-[13px] text-[#102858] flex items-center gap-2 hover:bg-[#F2F3FC] transition-colors">
            <span class="material-symbols-outlined text-[17px] text-[#0060C0]">help</span>
            <span class="truncate">하루에 두 번 토했는데 병원에 가야 할까요?</span>
          </button>
          <button type="button" class="w-full text-left p-3 rounded-[10px] bg-white border border-[#DCE3EE] text-[13px] text-[#102858] flex items-center gap-2 hover:bg-[#F2F3FC] transition-colors">
            <span class="material-symbols-outlined text-[17px] text-[#0060C0]">help</span>
            <span class="truncate">슬개골 탈구는 집에서 어떻게 관리하나요?</span>
          </button>
        </div>
      </section>

    </main>

    <!-- 2. Bottom Fixed Bar (Fixed to 390px frame width) -->
    <div class="fixed bottom-0 w-full max-w-[390px] bg-white border-t border-[#DCE3EE] shadow-[0_-4px_16px_rgba(0,0,0,0.06)] z-50">
      
      <!-- One-line Emergency Notice -->
      <div class="bg-[#FFF0EE] border-b border-[#B42318]/20 px-3.5 py-1.5 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[15px] text-[#B42318] fill-1 flex-shrink-0">warning</span>
        <span class="text-[12px] font-medium text-[#B42318] truncate">응급하면 바로 동물병원에 연락하세요</span>
      </div>

      <!-- Input and Action Section -->
      <div class="p-3 space-y-2">
        <!-- Question Text Input Area -->
        <div class="border border-[#7A879A]/50 rounded-[10px] bg-white p-2.5 focus-within:border-[#0060C0] transition-colors">
          <textarea 
            rows="2" 
            placeholder="반려견에 대해 궁금한 점을 적어 주세요" 
            class="w-full text-[14px] text-[#102858] placeholder-[#7A879A] resize-none focus:outline-none bg-transparent"
          ></textarea>
          
          <div class="flex items-center justify-between pt-1 border-t border-[#DCE3EE]/60 mt-1">
            <span class="text-[11px] text-[#526078]">0/1000</span>
            <!-- 보내기 button disabled -->
            <button 
              type="button" 
              disabled 
              class="h-8 px-3.5 rounded-[8px] bg-[#DCE3EE] text-[#7A879A] text-[13px] font-semibold flex items-center gap-1 cursor-not-allowed select-none"
              aria-disabled="true"
            >
              <span>보내기</span>
              <span class="material-symbols-outlined text-[16px]">arrow_upward</span>
            </button>
          </div>
        </div>

        <!-- Helper Text -->
        <div class="flex items-center justify-center gap-1 text-[12px] text-[#526078] pt-0.5 pb-1">
          <span class="material-symbols-outlined text-[14px] text-[#526078]">info</span>
          <span>품종과 나이를 입력하면 보낼 수 있어요</span>
        </div>
      </div>

      <!-- Legal microcopy footer note -->
      <div class="bg-[#F7F9FC] py-1 border-t border-[#DCE3EE]/40 text-center">
        <p class="text-[10px] text-[#526078]">AI가 정리한 정보이며 진단이 아닙니다</p>
      </div>

    </div>

  </div>

</body>
</html>
