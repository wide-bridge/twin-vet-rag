<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwinVet Care - 반려견 건강 정보 상담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0060C0',
            'primary-hover': '#004E9E',
            'primary-container': '#E6F0FA',
            secondary: '#402878',
            'secondary-hover': '#321F5E',
            background: '#F7F9FC',
            surface: '#FFFFFF',
            'on-surface': '#102858',
            'on-surface-variant': '#526078',
            outline: '#7A879A',
            'outline-variant': '#DCE3EE',
            error: '#B42318',
            'error-container': '#FFF0EE',
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
          },
          borderRadius: {
            'custom': '12px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #F7F9FC;
      color: #102858;
      -webkit-font-smoothing: antialiased;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<!-- TwinVet Care brand lockup (scripts/apply_brand_lockup.py) -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="../../../brand/brand-tokens.css" rel="stylesheet"/>
<link href="../../../brand/brand-lockup.css" rel="stylesheet"/>
<style>
  header .brand-lockup { --logo-w: 108px; text-decoration: none; }
  header:has(.brand-lockup) { background-color: #FFFFFF; } /* logo is made for a white background */
  /* the logo's speech bubbles reach the image top: give the header breathing room above the lockup */
  header:has(.brand-lockup) { height: auto; min-height: 64px; padding-top: 14px; padding-bottom: 8px; }
</style>
</head>
<body class="bg-background text-on-surface antialiased flex justify-center min-h-screen">
  <!-- Mobile Device Frame Container (390px standard) -->
  <div class="w-full max-w-[390px] bg-background min-h-screen flex flex-col relative shadow-md pb-44 border-x border-outline-variant/40">

    <!-- 1. Header -->
    <header class="sticky top-0 z-30 bg-surface border-b border-outline-variant px-4 h-14 flex items-center justify-between">
      <!-- Brand Lockup: Twin & Care purple (#402878), Vet blue (#0060C0) -->
      <a class="brand-lockup" href="#" aria-label="TwinVet Care"><img src="../../../brand/twinvet-logo-original.png" alt="" width="683" height="283"/><span class="care" aria-hidden="true">Care</span></a>

      <!-- Menu Button with Dropdown Demo -->
      <div class="relative">
        <button id="menu-btn" aria-label="메뉴" class="w-10 h-10 flex items-center justify-center rounded-lg text-on-surface hover:bg-slate-100 active:scale-95 transition-all">
          <span class="material-symbols-outlined text-[24px]">more_vert</span>
        </button>

        <!-- Dropdown Menu ('새 상담', '대화 삭제') -->
        <div id="dropdown-menu" class="hidden absolute right-0 mt-1 w-32 bg-surface rounded-custom shadow-lg border border-outline-variant py-1.5 z-40 text-sm font-medium">
          <button class="w-full text-left px-3.5 py-2 hover:bg-slate-50 flex items-center gap-2 text-on-surface">
            <span class="material-symbols-outlined text-[18px] text-on-surface-variant">add_circle</span>
            새 상담
          </button>
          <div class="h-[1px] bg-outline-variant/70 my-1"></div>
          <button class="w-full text-left px-3.5 py-2 hover:bg-error-container/40 flex items-center gap-2 text-error">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            대화 삭제
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 px-4 py-4 flex flex-col gap-4">

      <!-- 2. Card '우리 아이 정보' -->
      <section class="bg-surface rounded-custom border border-outline-variant p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3.5">
          <h2 class="text-[16px] font-bold text-on-surface flex items-center gap-1.5">
            <span class="material-symbols-outlined text-primary text-[20px]">pets</span>
            우리 아이 정보
          </h2>
          <span class="text-xs text-on-surface-variant">* 필수 항목</span>
        </div>

        <div class="space-y-3.5">
          <!-- Breed Field with autocomplete look -->
          <div>
            <label for="breed-input" class="block text-xs font-semibold text-on-surface-variant mb-1.5">
              품종 <span class="text-primary">*</span>
            </label>
            <div class="relative">
              <input 
                id="breed-input" 
                type="text" 
                placeholder="예: 말티즈, 믹스견, 모름" 
                class="w-full h-11 px-3.5 pr-9 text-base bg-surface border border-outline/70 rounded-lg text-on-surface placeholder:text-outline/70 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
              />
              <span class="material-symbols-outlined absolute right-2.5 top-1/2 -translate-y-1/2 text-outline/80 pointer-events-none text-[20px]">
                search
              </span>
            </div>
          </div>

          <!-- Age Row -->
          <div>
            <label class="block text-xs font-semibold text-on-surface-variant mb-1.5">
              나이 <span class="text-primary">*</span>
            </label>
            <div class="flex items-center gap-2">
              <div class="flex-1 relative flex items-center">
                <input 
                  type="number" 
                  min="0" 
                  max="30" 
                  placeholder="0" 
                  class="w-full h-11 px-3 pr-8 text-base bg-surface border border-outline/70 rounded-lg text-on-surface placeholder:text-outline/70 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                />
                <span class="absolute right-3 text-sm font-medium text-on-surface-variant pointer-events-none">년</span>
              </div>
              <div class="flex-1 relative flex items-center">
                <input 
                  type="number" 
                  min="0" 
                  max="11" 
                  placeholder="0" 
                  class="w-full h-11 px-3 pr-10 text-base bg-surface border border-outline/70 rounded-lg text-on-surface placeholder:text-outline/70 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                />
                <span class="absolute right-3 text-sm font-medium text-on-surface-variant pointer-events-none">개월</span>
              </div>
            </div>
            <p class="text-[12px] text-on-surface-variant mt-1.5 flex items-center gap-1">
              <span class="material-symbols-outlined text-[14px] text-on-surface-variant">info</span>
              정확하지 않아도 괜찮아요
            </p>
          </div>

          <!-- Collapsed Toggle Row: 건강상태 (선택) ▸ -->
          <div class="pt-1 border-t border-outline-variant/60">
            <button 
              type="button" 
              onclick="document.getElementById('health-toggle-content').classList.toggle('hidden'); document.getElementById('toggle-arrow').classList.toggle('rotate-90');"
              class="w-full py-1.5 flex items-center justify-between text-xs font-medium text-on-surface-variant hover:text-on-surface transition-colors"
            >
              <span>건강상태 (선택)</span>
              <span id="toggle-arrow" class="material-symbols-outlined text-[18px] transition-transform duration-200">chevron_right</span>
            </button>
            <div id="health-toggle-content" class="hidden mt-2 p-2.5 bg-slate-50 rounded-lg border border-outline-variant/60 text-xs text-on-surface-variant leading-relaxed">
              기저 질환, 최근 수술 이력, 복용 중인 약물이 있다면 함께 고려하여 참고 자료를 찾아드립니다.
            </div>
          </div>
        </div>
      </section>

      <!-- 3. Section '이런 질문을 할 수 있어요' -->
      <section class="space-y-2.5">
        <div class="flex items-center gap-1.5 px-0.5">
          <span class="material-symbols-outlined text-secondary text-[18px]">lightbulb</span>
          <h3 class="text-sm font-bold text-secondary">이런 질문을 할 수 있어요</h3>
        </div>
        <div class="grid grid-cols-1 gap-2">
          <button 
            type="button" 
            onclick="setQuestion('하루에 두 번 토했는데 병원에 가야 할까요?')" 
            class="text-left p-3 rounded-custom bg-surface border border-outline-variant hover:border-primary/50 hover:bg-primary-container/20 active:scale-[0.99] transition-all flex items-start gap-2.5 shadow-xs"
          >
            <span class="material-symbols-outlined text-primary text-[18px] shrink-0 mt-0.5">help_outline</span>
            <span class="text-sm text-on-surface leading-snug">하루에 두 번 토했는데 병원에 가야 할까요?</span>
          </button>

          <button 
            type="button" 
            onclick="setQuestion('귀를 자주 긁고 냄새가 나요')" 
            class="text-left p-3 rounded-custom bg-surface border border-outline-variant hover:border-primary/50 hover:bg-primary-container/20 active:scale-[0.99] transition-all flex items-start gap-2.5 shadow-xs"
          >
            <span class="material-symbols-outlined text-primary text-[18px] shrink-0 mt-0.5">help_outline</span>
            <span class="text-sm text-on-surface leading-snug">귀를 자주 긁고 냄새가 나요</span>
          </button>

          <button 
            type="button" 
            onclick="setQuestion('슬개골 탈구는 집에서 어떻게 관리하나요?')" 
            class="text-left p-3 rounded-custom bg-surface border border-outline-variant hover:border-primary/50 hover:bg-primary-container/20 active:scale-[0.99] transition-all flex items-start gap-2.5 shadow-xs"
          >
            <span class="material-symbols-outlined text-primary text-[18px] shrink-0 mt-0.5">help_outline</span>
            <span class="text-sm text-on-surface leading-snug">슬개골 탈구는 집에서 어떻게 관리하나요?</span>
          </button>

          <button 
            type="button" 
            onclick="setQuestion('눈곱이 갑자기 많아졌어요')" 
            class="text-left p-3 rounded-custom bg-surface border border-outline-variant hover:border-primary/50 hover:bg-primary-container/20 active:scale-[0.99] transition-all flex items-start gap-2.5 shadow-xs"
          >
            <span class="material-symbols-outlined text-primary text-[18px] shrink-0 mt-0.5">help_outline</span>
            <span class="text-sm text-on-surface leading-snug">눈곱이 갑자기 많아졌어요</span>
          </button>
        </div>
      </section>

      <!-- 4. Empty conversation area (Visual placeholder for pristine pre-question state) -->
      <div class="flex-1 flex flex-col items-center justify-center py-6 text-center text-outline">
        <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mb-2 text-outline">
          <span class="material-symbols-outlined text-[24px]">chat_bubble_outline</span>
        </div>
        <p class="text-xs text-on-surface-variant/80">아이의 기본 정보와 질문을 작성해 주세요</p>
      </div>

    </main>

    <!-- 5. Bottom area fixed to the bottom -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[390px] bg-surface border-t border-outline-variant p-3.5 z-40 shadow-lg">
      
      <!-- Static Emergency Guidance (Compact single line, red text) -->
      <div class="flex items-center gap-1.5 text-error text-[12px] font-semibold mb-2 bg-error-container/60 px-2.5 py-1 rounded-md">
        <span class="material-symbols-outlined text-[15px] shrink-0">warning</span>
        <span class="truncate">응급하면 바로 동물병원에 연락하세요</span>
      </div>

      <!-- Multiline Text Input with Character Counter & Send Button -->
      <div class="relative bg-background rounded-lg border border-outline/70 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-colors p-2.5">
        <textarea 
          id="question-input" 
          rows="2" 
          placeholder="반려견에 대해 궁금한 점을 적어 주세요" 
          class="w-full bg-transparent text-base text-on-surface placeholder:text-outline/80 resize-none focus:outline-none leading-relaxed"
          oninput="updateCount(this)"
        ></textarea>

        <div class="flex items-center justify-between pt-1 mt-1 border-t border-outline-variant/40">
          <!-- Character Count -->
          <span id="char-count" class="text-[11px] font-medium text-on-surface-variant">0/1000</span>

          <!-- Primary Send Button (Disabled look by default because breed/age are empty) -->
          <button 
            type="button" 
            disabled 
            class="px-4 py-1.5 rounded-lg bg-outline/40 text-surface text-sm font-semibold cursor-not-allowed flex items-center gap-1 transition-all"
            title="품종과 나이를 먼저 입력해 주세요"
          >
            <span>보내기</span>
            <span class="material-symbols-outlined text-[16px]">arrow_upward</span>
          </button>
        </div>
      </div>

      <!-- Tiny Helper / Disclaimer Text -->
      <p class="text-[11px] text-center text-on-surface-variant mt-2">
        AI가 정리한 정보이며 진단이 아닙니다
      </p>
    </div>

  </div>

  <script>
    // Toggle dropdown
    const menuBtn = document.getElementById('menu-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => {
      dropdownMenu.classList.add('hidden');
    });

    // Example question chip filler
    function setQuestion(text) {
      const input = document.getElementById('question-input');
      input.value = text;
      updateCount(input);
      input.focus();
    }

    // Char count update
    function updateCount(el) {
      const counter = document.getElementById('char-count');
      counter.textContent = `${el.value.length}/1000`;
    }
  </script>
</body>
</html>
